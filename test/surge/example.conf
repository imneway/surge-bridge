#!MANAGED-CONFIG https://example.invalid/work.conf interval=3600
[General]
loglevel = notify
ipv6 = false
exclude-simple-hostnames = true
dns-server = 223.5.5.5, 119.29.29.29
encrypted-dns-server = h3://223.5.5.5/dns-query, https://dns.example.com/dns-query
skip-proxy = 192.168.0.0/16, localhost, *.local
tun-excluded-routes = 192.168.0.0/16, 10.0.0.0/8
hijack-dns = *:53
[Proxy]
Test v6 = snell, 192.0.2.1, 443, psk="test-key,with#punctuation", version=6, tfo=true
Test raw = snell, 192.0.2.2, 443, psk=test-key, version=6, mode=unshaped, reuse=true
[Proxy Group]
Proxy = select, Test v6, Test raw, DIRECT
[Rule]
DOMAIN,example.net,Proxy
AND,((DEST-PORT,22),(IP-CIDR,192.0.2.1/32,no-resolve)),DIRECT
IP-CIDR,192.0.2.5/32,REJECT,no-resolve
RULE-SET,https://example.invalid/domains.list,Proxy,update-interval=86400
RULE-SET,https://example.invalid/china.list,DIRECT
GEOIP,CN,DIRECT
FINAL,Proxy,dns-failed
